<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%s</title> <!-- 1st %s: Page Title -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.12/plyr.css" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background-color: #060912;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }

        .header-box {
            width: 100%;
            aspect-ratio: 3.4 / 1;
            background-image: url('https://i.postimg.cc/GhvfCV6V/53426.png'); /* இங்கே Background லிங்க் போடுங்க */
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
        }

        .movie-title {
            width: 90%;
            text-align: center;
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-placeholder {
            width: 90%;
            max-width: 400px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            margin: 0 auto;
            background: #000;
        }
        
        /* Plyr வீடியோ முழுமையாக நிரம்ப */
        .plyr { width: 100%; height: 100%; }

        .choose-option {
            width: 90%;
            max-width: 380px;
            text-align: center;
            margin-top: 4%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .choose-option .line1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            background: linear-gradient(90deg, #ffffff, #cfd8ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px rgba(0, 200, 255, 0.35);
        }
        .choose-option .line1::before,
        .choose-option .line1::after {
            content: "";
            flex: 1;
            height: 2px;
            max-width: 30px;
            background: linear-gradient(90deg, transparent, #00e5ff);
            box-shadow: 0 0 6px #00e5ff;
        }
        .choose-option .line1::after { background: linear-gradient(90deg, #00e5ff, transparent); }
        .choose-option .line2 {
            font-size: 10px;
            letter-spacing: 0.5px;
            font-style: italic;
            font-weight: 700;
            color: #c9971f;
            margin-top: 6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 380px;
            margin: 4% auto 5% auto;
        }

        .btn-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            margin-bottom: 4vw;
            transition: transform 0.2s;
        }
        .btn-img:active { transform: scale(0.95); }
        .btn-img:last-child { margin-bottom: 0; }

        .footer-box {
            width: 100%;
            aspect-ratio: 3.2 / 1;
            background-image: url('https://i.postimg.cc/GhvfCV6V/53426.png'); /* இங்கே Background லிங்க் போடுங்க */
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="header-box"></div>
    
    <!-- 2nd %s: Movie Name Display -->
    <div class="movie-title">
        <marquee direction="left">%s</marquee>
    </div>

    <!-- 3rd %s: Video URL Player -->
    <div class="player-placeholder">
        <video id="main-video" class="player" playsinline controls>
            <source src="%s" type="video/mp4" />
        </video>
    </div>

    <div class="choose-option">
        <div class="line1">🎬 Choose your option</div>
        <div class="line2">Download or play in your favorite player</div>
    </div>

    <div class="buttons-container">
        <a id="link-dl" href="#"><img src="https://i.postimg.cc/QMM9sLYt/jpeg-optimizer-53434.png" class="btn-img" alt="Download Video"></a>
        <a id="link-vlc" href="#"><img src="https://i.postimg.cc/YjcqmZxb/jpeg-optimizer-53432.png" class="btn-img" alt="PLAY IN VLC"></a>
        <a id="link-playit" href="#"><img src="https://i.postimg.cc/zD9wMJ5H/Picsart-26-09-09-12-21-44-295.png" class="btn-img" alt="PLAY IN PLAYit"></a>
    </div>

    <div class="footer-box"></div>

    <script src="https://cdn.plyr.io/3.6.12/plyr.js"></script>
    <script>
        // 1. பிளேயரை ஆக்டிவேட் செய்வது
        document.addEventListener('DOMContentLoaded', () => {
            const player = new Plyr('.player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
            });

            // 2. வீடியோ லிங்க்கை எடுத்து பட்டன்களுக்குக் கொடுப்பது (Python %s எரரைத் தவிர்க்கும் ரகசிய வழி)
            const videoElement = document.getElementById('main-video');
            const videoSrc = videoElement.querySelector('source').src;

            // டவுன்லோட் லிங்க்
            document.getElementById('link-dl').href = videoSrc;

            // VLC Player Intent லிங்க்
            const vlcUrl = videoSrc.replace(/^https?:\/\//, '');
            document.getElementById('link-vlc').href = "intent://" + vlcUrl + "#Intent;package=org.videolan.vlc;type=video/*;scheme=https;end";

            // PLAYit Player Intent லிங்க்
            document.getElementById('link-playit').href = "playit://play/?url=" + encodeURIComponent(videoSrc);
        });
    </script>
</body>
</html>
